    <style id="theme-vars">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;600&display=swap');

/*
 * DailySpeak design tokens
 * Based on Apple Design Library structural tokens
 * Brand color overridden per user spec: #3b82f6 → #10b981 gradient
 * Style: Modern, fresh, friendly learning aesthetic
 * Theme mode: light
 */

/* @group-priority: brand, background, text, icon, state-success, state-error, gradient */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #1d1d1f);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #3b82f6);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--background-200));
  --apple-muted-foreground: var(--muted-foreground, var(--text-500));
  --apple-accent: var(--accent, var(--background-100));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, var(--background-300));
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--teal-500));
  --apple-chart-3: var(--chart-3, #f59e0b);
  --apple-chart-4: var(--chart-4, var(--text-500));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));
  --apple-radius-sm: var(--radius-sm, 0.6rem);
  --apple-radius-md: var(--radius-md, 0.9rem);
  --apple-radius-lg: var(--radius-lg, 1.2rem);
  --apple-radius-xl: var(--radius-xl, 1.6rem);

/* ===== PRIMITIVE PALETTE ===== */

  /* brand — blue scale centered on #3b82f6 */
  --brand-50: #eff6ff;
  --brand-100: #dbeafe;
  --brand-200: #bfdbfe;
  --brand-300: #93c5fd;
  --brand-400: #60a5fa;
  --brand-500: #3b82f6; /* @primary */
  --brand-600: #2563eb;
  --brand-700: #1d4ed8;
  --brand-800: #1e40af;
  --brand-900: #1e3a8a;

  /* teal — gradient endpoint */
  --teal-50: #ecfdf5;
  --teal-100: #d1fae5;
  --teal-200: #a7f3d0;
  --teal-300: #6ee7b7;
  --teal-400: #34d399;
  --teal-500: #10b981; /* @gradient-end */
  --teal-600: #059669;
  --teal-700: #047857;
  --teal-800: #065f46;
  --teal-900: #064e3b;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #10b981;
  --state-success-dark: #059669;
  --state-success-surface: #ecfdf5;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ef4444;
  --state-error-dark: #dc2626;
  --state-error-surface: #fef2f2;
  --state-error-foreground: #ffffff;

  /* ===== GRADIENT TOKENS ===== */
  --gradient-primary: linear-gradient(135deg, #3b82f6, #10b981);
  --gradient-primary-hover: linear-gradient(135deg, #2563eb, #059669);
  --gradient-soft: linear-gradient(135deg, #eff6ff, #ecfdf5);
  --gradient-accent: linear-gradient(135deg, #dbeafe, #d1fae5);
  --gradient-text: linear-gradient(135deg, #3b82f6, #10b981);

  /* ===== SEMANTIC ROLES ===== */

  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-500);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--brand-500);
  --chart-2: var(--teal-500);
  --chart-3: #f59e0b;
  --chart-4: #8b5cf6;
  --chart-5: var(--text-500);

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;
  --radius-sm: 0.6rem;
  --radius-md: 0.9rem;
  --radius-lg: 1.2rem;
  --radius-xl: 1.6rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12);

  /* SPACING */
  --spacing: 0.24rem;
}

<body class="min-h-screen font-sans antialiased">
    <main>
      <nav class="sticky top-0 z-50 h-14 flex items-center px-6 border-b" style="background: var(--background); border-color: var(--border);">
        <a href="#" class="flex items-center gap-2" aria-label="DailySpeak home">
          <span class="text-xl font-bold tracking-tight" style="background: var(--gradient-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;">DailySpeak</span>
        </a>
      </nav>

      <div class="mx-auto px-6 py-8" style="max-width: 48rem;">
        <header class="text-center mb-8">
          <h1 class="text-2xl font-semibold" style="color: var(--foreground);">练习结果</h1>
          <p class="text-sm mt-1" style="color: var(--muted-foreground);">跟读完成</p>
        </header>

        <div class="rings-row flex justify-center items-start gap-8 mb-10">
          <div class="flex flex-col items-center">
            <div class="score-ring-wrap">
              <svg class="score-ring-svg" viewBox="0 0 160 160" role="img" aria-label="发音得分 92 分">
                <defs>
                  <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="var(--brand-500)"></stop>
                    <stop offset="100%" stop-color="var(--teal-500)"></stop>
                  </linearGradient>
                </defs>
                <circle cx="80" cy="80" r="74" fill="none" stroke-width="12" stroke="var(--background-200)"></circle>
                <circle cx="80" cy="80" r="74" fill="none" stroke-width="12" stroke="url(#ringGradient)" stroke-linecap="round" stroke-dasharray="464.96" stroke-dashoffset="69.74" transform="rotate(-90 80 80)"></circle>
              </svg>
              <div class="score-ring-overlay">
                <span class="text-4xl font-bold" style="color: var(--foreground);">92</span>
              </div>
            </div>
            <span class="text-sm mt-3" style="color: var(--muted-foreground);">发音得分</span>
          </div>

          <div class="flex flex-col items-center">
            <div class="score-ring-wrap">
              <svg class="score-ring-svg" viewBox="0 0 160 160" role="img" aria-label="情境应答 待完成">
                <circle cx="80" cy="80" r="74" fill="none" stroke-width="12" stroke="var(--background-200)"></circle>
              </svg>
              <div class="score-ring-overlay">
                <span class="text-4xl font-bold" style="color: var(--muted-foreground);">—</span>
              </div>
            </div>
            <span class="text-sm mt-3" style="color: var(--muted-foreground);">情境应答</span>
          </div>
        </div>

        <div class="feedback-card mb-8">
          <h2 class="text-lg font-semibold mb-4" style="color: var(--foreground);">发音反馈</h2>
          <ul class="space-y-3">
            <li class="flex items-center gap-3">
              <i data-lucide="circle-check" class="w-5 h-5" style="color: var(--state-success);"></i>
              <span class="text-sm" style="color: var(--foreground);">语调自然流畅</span>
            </li>
            <li class="flex items-center gap-3">
              <i data-lucide="circle-check" class="w-5 h-5" style="color: var(--state-success);"></i>
              <span class="text-sm" style="color: var(--foreground);">重音位置准确</span>
            </li>
            <li class="flex items-center gap-3">
              <i data-lucide="circle-alert" class="w-5 h-5" style="color: var(--state-error);"></i>
              <span class="text-sm" style="color: var(--foreground);">注意 /θ/ 发音</span>
            </li>
          </ul>
        </div>

        <div class="flex justify-center">
          <button class="inline-flex items-center justify-center gap-2" style="background: var(--gradient-primary); color: var(--primary-foreground); border-radius: 999px; padding: 14px 32px; font-weight: 600; border: none; cursor: pointer;">
            <span>进入情境应答</span>
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <style id="critical-layout">
        .score-ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .score-ring-svg { display: block; width: 160px; height: 160px; max-width: 100%; }
        .score-ring-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        .feedback-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 24px; }
        @media (max-width: 520px) {
          .score-ring-svg { width: 140px; height: 140px; }
          .rings-row { gap: 1.5rem; }
        }
        @media (max-width: 380px) {
          .score-ring-svg { width: 116px; height: 116px; }
          .rings-row { gap: 1rem; }
        }
      </style>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
