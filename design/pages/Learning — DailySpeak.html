@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;600&display=swap');

/*
 * DailySpeak design tokens
 * Based on Apple Design Library structural tokens
 * Brand color overridden per user spec: #3b82f6 → #10b981 gradient
 * Style: Modern, fresh, friendly learning aesthetic
 * Theme mode: light
 */

/* @group-priority: brand, background, text, icon, state-success, state-error, gradient */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #1d1d1f);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #3b82f6);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--background-200));
  --apple-muted-foreground: var(--muted-foreground, var(--text-500));
  --apple-accent: var(--accent, var(--background-100));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, var(--background-300));
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--teal-500));
  --apple-chart-3: var(--chart-3, #f59e0b);
  --apple-chart-4: var(--chart-4, var(--text-500));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));
  --apple-radius-sm: var(--radius-sm, 0.6rem);
  --apple-radius-md: var(--radius-md, 0.9rem);
  --apple-radius-lg: var(--radius-lg, 1.2rem);
  --apple-radius-xl: var(--radius-xl, 1.6rem);

/* ===== PRIMITIVE PALETTE ===== */

  /* brand — blue scale centered on #3b82f6 */
  --brand-50: #eff6ff;
  --brand-100: #dbeafe;
  --brand-200: #bfdbfe;
  --brand-300: #93c5fd;
  --brand-400: #60a5fa;
  --brand-500: #3b82f6; /* @primary */
  --brand-600: #2563eb;
  --brand-700: #1d4ed8;
  --brand-800: #1e40af;
  --brand-900: #1e3a8a;

  /* teal — gradient endpoint */
  --teal-50: #ecfdf5;
  --teal-100: #d1fae5;
  --teal-200: #a7f3d0;
  --teal-300: #6ee7b7;
  --teal-400: #34d399;
  --teal-500: #10b981; /* @gradient-end */
  --teal-600: #059669;
  --teal-700: #047857;
  --teal-800: #065f46;
  --teal-900: #064e3b;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #10b981;
  --state-success-dark: #059669;
  --state-success-surface: #ecfdf5;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ef4444;
  --state-error-dark: #dc2626;
  --state-error-surface: #fef2f2;
  --state-error-foreground: #ffffff;

  /* ===== GRADIENT TOKENS ===== */
  --gradient-primary: linear-gradient(135deg, #3b82f6, #10b981);
  --gradient-primary-hover: linear-gradient(135deg, #2563eb, #059669);
  --gradient-soft: linear-gradient(135deg, #eff6ff, #ecfdf5);
  --gradient-accent: linear-gradient(135deg, #dbeafe, #d1fae5);
  --gradient-text: linear-gradient(135deg, #3b82f6, #10b981);

  /* ===== SEMANTIC ROLES ===== */

  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-500);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--brand-500);
  --chart-2: var(--teal-500);
  --chart-3: #f59e0b;
  --chart-4: #8b5cf6;
  --chart-5: var(--text-500);

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;
  --radius-sm: 0.6rem;
  --radius-md: 0.9rem;
  --radius-lg: 1.2rem;
  --radius-xl: 1.6rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12);

  /* SPACING */
  --spacing: 0.24rem;
}

<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
      .ds-nav {
        position: sticky;
        top: 0;
        z-index: 50;
        height: 3.5rem;
        background: var(--background);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(12px);
      }
      .ds-nav-inner {
        max-width: 48rem;
        margin: 0 auto;
        height: 100%;
        padding: 0 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .ds-logo {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: var(--gradient-text);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .ds-exit {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--muted-foreground);
        text-decoration: none;
        transition: color .18s ease;
      }
      .ds-exit:hover { color: var(--foreground); }
      .ds-container {
        max-width: 48rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 6rem;
      }
      .ds-tag-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
      .ds-domain-tag {
        display: inline-flex;
        align-items: center;
        background: var(--brand-50);
        color: var(--brand-600);
        border: 1px solid var(--brand-100);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
      }
      .ds-step-tag {
        display: inline-flex;
        align-items: center;
        background: var(--gradient-primary);
        color: var(--primary-foreground);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        box-shadow: var(--shadow-sm);
      }
      .ds-sentence-card {
        max-width: 42rem;
        margin: 1.5rem auto 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-md);
        padding: 2rem;
      }
      .ds-eyebrow { color: var(--muted-foreground); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .ds-sentence-en {
        font-size: 2.25rem;
        font-weight: 600;
        line-height: 1.3;
        color: var(--foreground);
        margin: 0;
      }
      @media (max-width: 640px) { .ds-sentence-en { font-size: 1.875rem; } }
      .ds-sentence-zh {
        margin-top: 0.75rem;
        font-size: 1.125rem;
        color: var(--muted-foreground);
      }
      .ds-record-section { margin-top: 3rem; display: flex; flex-direction: column; align-items: center; }
      .ds-instruction { font-size: 0.875rem; color: var(--muted-foreground); text-align: center; }
      .ds-mic-btn {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: var(--gradient-primary);
        color: var(--primary-foreground);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-lg);
        position: relative;
        margin-top: 1.5rem;
        transition: transform .18s ease, filter .18s ease;
      }
      .ds-mic-btn:hover { transform: scale(1.05); filter: brightness(1.03); }
      .ds-mic-btn:active { transform: scale(0.97); }
      .ds-mic-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        background: var(--gradient-primary);
        opacity: 0.35;
        animation: ds-pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        z-index: -1;
      }
      @keyframes ds-pulse-ring {
        0% { transform: scale(0.92); opacity: 0.45; }
        70% { transform: scale(1.45); opacity: 0; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      .ds-rec-status { margin-top: 1.25rem; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 12px; color: var(--muted-foreground); }
      .ds-dots { display: inline-flex; gap: 3px; }
      .ds-dots span {
        width: 5px; height: 5px; border-radius: 50%;
        background: var(--state-error);
        animation: ds-blink 1.4s infinite both;
      }
      .ds-dots span:nth-child(2) { animation-delay: 0.2s; }
      .ds-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes ds-blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
      .ds-bottom {
        position: sticky;
        bottom: 0;
        z-index: 40;
        background: var(--background);
        border-top: 1px solid var(--border);
      }
      .ds-bottom-inner {
        max-width: 48rem;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1rem 1.5rem;
        flex-wrap: wrap;
      }
      .ds-btn-ghost {
        background: transparent;
        color: var(--muted-foreground);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 12px 24px;
        font-weight: 600;
        font-size: 0.875rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        transition: background-color .18s ease, color .18s ease;
      }
      .ds-btn-ghost:hover { background: var(--accent); color: var(--foreground); }
      .ds-btn-primary {
        background: var(--gradient-primary);
        color: var(--primary-foreground);
        border: none;
        border-radius: 999px;
        padding: 14px 32px;
        font-weight: 600;
        font-size: 0.875rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: filter .18s ease, transform .18s ease;
      }
      .ds-btn-primary:hover { filter: brightness(0.96); }
      .ds-btn-primary:active { transform: scale(0.98); }
      [data-lucide] { stroke-width: 2; }
    </style>
    <main>
      <nav class="ds-nav" aria-label="Primary">
        <div class="ds-nav-inner">
          <a href="#" class="ds-logo">
            <i data-lucide="languages" style="width:1.25rem;height:1.25rem;color:var(--brand-500);"></i>
            DailySpeak
          </a>
          <a href="#" class="ds-exit">退出</a>
        </div>
      </nav>

      <div class="ds-container">
        <div class="ds-tag-row">
          <span class="ds-domain-tag">
            <i data-lucide="laptop" style="width:0.75rem;height:0.75rem;margin-right:0.375rem;"></i>计算机
          </span>
          <span class="ds-step-tag">
            <i data-lucide="repeat" style="width:0.75rem;height:0.75rem;margin-right:0.375rem;"></i>跟读
          </span>
        </div>

        <article class="ds-sentence-card">
          <div style="display:flex;align-items:flex-start;gap:0.75rem;margin-bottom:1rem;">
            <div style="display:flex;width:2.25rem;height:2.25rem;align-items:center;justify-content:center;border-radius:999px;background:var(--gradient-soft);">
              <i data-lucide="message-circle" style="width:1rem;height:1rem;color:var(--brand-600);"></i>
            </div>
            <div>
              <div class="ds-eyebrow">面试高频句</div>
              <div style="font-size:0.75rem;color:var(--muted-foreground);margin-top:2px;">Resume walkthrough</div>
            </div>
          </div>
          <p class="ds-sentence-en">Could you walk me through your resume?</p>
          <p class="ds-sentence-zh">你能带我过一下你的简历吗？</p>
          <div style="margin-top:1.5rem;display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;color:var(--muted-foreground);">
            <i data-lucide="volume-2" style="width:0.875rem;height:0.875rem;"></i>
            <span>点击下方录音按钮，模仿原音大声跟读</span>
          </div>
        </article>

        <section class="ds-record-section">
          <p class="ds-instruction">点击录音，大声跟读</p>
          <button class="ds-mic-btn" aria-label="开始录音" type="button">
            <span class="ds-mic-ring" aria-hidden="true"></span>
            <i data-lucide="mic" style="width:2.25rem;height:2.25rem;"></i>
          </button>
          <div class="ds-rec-status">
            <span class="ds-dots" aria-hidden="true"><span></span><span></span><span></span></span>
            <span>录音中...</span>
          </div>
        </section>
      </div>

      <div class="ds-bottom">
        <div class="ds-bottom-inner">
          <button class="ds-btn-ghost" type="button">
            <i data-lucide="circle-play" style="width:1rem;height:1rem;"></i>重听
          </button>
          <button class="ds-btn-ghost" type="button">
            <i data-lucide="rotate-ccw" style="width:1rem;height:1rem;"></i>重录
          </button>
          <button class="ds-btn-primary" type="button">
            <i data-lucide="check" style="width:1rem;height:1rem;"></i>完成
          </button>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
